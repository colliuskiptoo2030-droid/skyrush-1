<script>
  // System State Variables
  let balance = 1000, roundNo = 0, volume = 0;
  let inRound = false, mult = 1.00, crashPoint = 1.00;
  let avatarChoice = '✈️';
  let soundEnabled = true;
  let currentUser = null;
  let lastServerRound = -1;

  // Dual Panel Bet State
  const bets = {
    1: { active: false, cashed: false, amount: 0, payout: 0 },
    2: { active: false, cashed: false, amount: 0, payout: 0 }
  };

  // Canvas & Visual Particle Engine
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [], stars = [];

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    initStars();
  }
  window.addEventListener('resize', resizeCanvas);

  function initStars() {
    stars = [];
    for (let i = 0; i < 40; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.5 + 0.2 });
    }
  }

  // Audio Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (!soundEnabled) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);

      if (type === 'bet') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
      }
    } catch (e) {}
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
  }

  // UI Helper Functions
  const $ = id => document.getElementById(id);
  const money = x => 'KSh ' + x.toFixed(2);

  function show(pageId) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    $(pageId).classList.add('active');
    document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
    let t = $('t-' + pageId); if (t) t.classList.add('active');
  }

  function openModal(id) { 
    const m = $(id);
    if (m) m.classList.add('active'); 
  }
  
  function closeModal(id) { 
    const m = $(id);
    if (m) m.classList.remove('active'); 
  }

  function switchSidebar(tab) {
    if (tab === 'bets') {
      $('sideBets').style.display = 'block'; $('sideChat').style.display = 'none';
      $('btnSideBets').classList.add('active'); $('btnSideChat').classList.remove('active');
    } else {
      $('sideBets').style.display = 'none'; $('sideChat').style.display = 'flex';
      $('btnSideChat').classList.add('active'); $('btnSideBets').classList.remove('active');
    }
  }

  // Auth Engine
  function processAuth(type) {
    let name = type === 'login' ? $('loginName').value : $('regName').value;
    if (!name.trim()) name = 'Demo Pilot';
    currentUser = { name: name };
    localStorage.skyrush_user = JSON.stringify(currentUser);
    updateUserUI();
    closeModal('loginModal'); closeModal('regModal');
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem('skyrush_user');
    updateUserUI();
  }

  function updateUserUI() {
    if (currentUser) {
      $('userLabel').textContent = currentUser.name;
      $('loginNavBtn').textContent = 'Logout';
      $('loginNavBtn').onclick = logout;
      $('regNavBtn').style.display = 'none';
    } else {
      $('userLabel').textContent = 'Guest';
      $('loginNavBtn').textContent = 'Login';
      $('loginNavBtn').onclick = () => openModal('loginModal');
      $('regNavBtn').style.display = 'inline-flex';
    }
  }

  // Dual Bet Actions
  function handleBetAction(p) {
    const b = bets[p];
    if (inRound) {
      // Cashout Action
      if (b.active && !b.cashed) {
        b.cashed = true;
        b.payout = b.amount * mult;
        balance += b.payout;
        playSound('win');
        $(`p${p}Status`).textContent = `Cashed @ ${mult.toFixed(2)}x`;
        $(`p${p}Status`).style.color = '#22d39a';
        addHistory(p, b.amount, `${mult.toFixed(2)}x`, b.payout);
        renderUI();
      }
    } else {
      // Toggle/Place Bet
      if (!b.active) {
        let amt = parseFloat($(`b${p}Amount`).value);
        if (!amt || amt < 10 || amt > balance) return alert('Invalid virtual bet amount');
        b.active = true; b.cashed = false; b.amount = amt;
        balance -= amt; volume += amt;
        playSound('bet');
        $(`p${p}Status`).textContent = 'Queued';
        $(`p${p}Status`).style.color = '#ffb62e';
        renderUI();
      } else {
        // Cancel queued bet
        balance += b.amount; volume -= b.amount;
        b.active = false;
        $(`p${p}Status`).textContent = '—';
        renderUI();
      }
    }
  }

  function addHistory(panel, betAmt, res, payout) {
    $('hist').insertAdjacentHTML('afterbegin', 
      `<tr><td>#${roundNo}</td><td>Panel ${panel}</td><td>${money(betAmt)}</td><td><span class="${payout>0?'badge-win':'badge-loss'}">${res}</span></td><td>${money(payout)}</td></tr>`
    );
  }

  function renderUI() {
    $('bal').textContent = money(balance);
    $('wbal').textContent = money(balance);
    
    let totalActive = (bets[1].active && !bets[1].cashed ? bets[1].amount : 0) + (bets[2].active && !bets[2].cashed ? bets[2].amount : 0);
    $('totBet').textContent = money(totalActive);
    $('totProfit').textContent = money((bets[1].payout + bets[2].payout));

    // Panel 1 Buttons
    if (inRound) {
      if (bets[1].active && !bets[1].cashed) {
        $('b1Btn').className = 'btn btn-cash';
        $('b1Btn').textContent = `CASH OUT (${money(bets[1].amount * mult)})`;
        $('b1Btn').disabled = false;
      } else {
        $('b1Btn').className = 'btn btn-bet';
        $('b1Btn').textContent = 'IN ROUND';
        $('b1Btn').disabled = true;
      }
    } else {
      $('b1Btn').disabled = false;
      $('b1Btn').className = bets[1].active ? 'btn btn-cash' : 'btn btn-bet';
      $('b1Btn').textContent = bets[1].active ? 'CANCEL' : 'PLACE BET';
    }

    // Panel 2 Buttons
    if (inRound) {
      if (bets[2].active && !bets[2].cashed) {
        $('b2Btn').className = 'btn btn-cash';
        $('b2Btn').textContent = `CASH OUT (${money(bets[2].amount * mult)})`;
        $('b2Btn').disabled = false;
      } else {
        $('b2Btn').className = 'btn btn-bet';
        $('b2Btn').textContent = 'IN ROUND';
        $('b2Btn').disabled = true;
      }
    } else {
      $('b2Btn').disabled = false;
      $('b2Btn').className = bets[2].active ? 'btn btn-cash' : 'btn btn-bet';
      $('b2Btn').textContent = bets[2].active ? 'CANCEL' : 'PLACE BET';
    }

    $('adminRounds').textContent = roundNo;
    $('adminVol').textContent = money(volume);
  }

  // Simulated Players & Chat
  const botNames = ['ApexTrader', 'SkyWalker', 'CryptoKing', 'LuckyFlight', 'NairobiFlyer', 'MoonShot'];
  let simulatedPlayers = [];

  function generateSimulatedPlayers() {
    simulatedPlayers = botNames.map(name => ({
      name: name,
      bet: Math.floor(Math.random() * 20 + 2) * 50,
      target: (Math.random() * 4 + 1.1).toFixed(2),
      cashed: false
    }));
    renderSimulatedList();
  }

  function renderSimulatedList() {
    let html = '';
    simulatedPlayers.forEach(p => {
      html += `<div class="player-row"><span class="name">${p.name}</span><span>${money(p.bet)}</span><span class="${p.cashed?'win':''}">${p.cashed ? p.target+'x' : 'In Flight'}</span></div>`;
    });
    $('playerList').innerHTML = html;
  }

  function updateSimulatedPlayers() {
    simulatedPlayers.forEach(p => {
      if (!p.cashed && mult >= parseFloat(p.target)) {
        p.cashed = true;
      }
    });
    renderSimulatedList();
  }

  function sendChat() {
    let txt = $('chatInput').value.trim();
    if (!txt) return;
    let user = currentUser ? currentUser.name : 'Guest';
    $('chatMsgs').insertAdjacentHTML('beforeend', `<div class="chat-msg"><b>${user}</b>${txt}</div>`);
    $('chatInput').value = '';
    $('chatMsgs').scrollTop = $('chatMsgs').scrollHeight;
  }

  // Canvas Render Loop & Physics
  function drawGameScene(progressPct, crashed) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Starfield
    ctx.fillStyle = '#ffffff';
    stars.forEach(s => {
      s.y += s.speed;
      if (s.y > canvas.height) s.y = 0;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
    });

    // Position Calculation
    let startX = 50, startY = canvas.height - 50;
    let targetX = canvas.width * 0.8;
    let targetY = canvas.height * 0.25;

    let currentX = startX + (targetX - startX) * progressPct;
    let currentY = startY - (startY - targetY) * progressPct;

    // 2. Flight Trajectory Line
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX + (currentX - startX) * 0.5, startY, currentX, currentY);
    ctx.strokeStyle = crashed ? '#ff3d71' : '#22d39a';
    ctx.lineWidth = 4;
    ctx.shadowBlur = 12; ctx.shadowColor = ctx.strokeStyle;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 3. Smoke Particles
    if (inRound && !crashed) {
      particles.push({ x: currentX - 10, y: currentY + 10, size: Math.random() * 8 + 4, opacity: 1 });
    }

    particles.forEach((p, idx) => {
      p.opacity -= 0.02;
      p.x -= 1; p.y += 0.5;
      ctx.fillStyle = crashed ? `rgba(255, 61, 113, ${p.opacity})` : `rgba(255, 255, 255, ${p.opacity})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      if (p.opacity <= 0) particles.splice(idx, 1);
    });

    // 4. Render Avatar / Explosion
    if (!crashed) {
      ctx.font = '36px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(avatarChoice, currentX, currentY);
    } else {
      // Crash Explosion
      ctx.font = '42px Arial';
      ctx.fillText('💥', currentX, currentY);
    }
  }

  // Real-Time Server Engine Synchronization Loop
  async function syncGameWithServer() {
    try {
      const res = await fetch('/api/live-state');
      const data = await res.json();

      let elapsed = data.elapsedTime;
      crashPoint = data.currentCrash;

      // Handle Round Transitions
      if (data.roundIndex !== lastServerRound) {
        lastServerRound = data.roundIndex;
        roundNo = data.roundIndex;
        inRound = true;
        
        $('stateBadge').textContent = 'FLIGHT IN PROGRESS';
        $('mult').classList.remove('crashed');
        
        // Reset Bets for new round
        [1, 2].forEach(p => {
          if (bets[p].active) {
            bets[p].cashed = false;
            bets[p].payout = 0;
            $(`p${p}Status`).textContent = 'In Flight';
            $(`p${p}Status`).style.color = '#22d39a';
          }
        });

        generateSimulatedPlayers();
        renderUI();
      }

      // Calculate server-matched multiplier curve
      mult = parseFloat((1.00 + Math.pow(elapsed, 1.7) * 0.12).toFixed(2));

      if (mult < crashPoint && elapsed < 10) {
        inRound = true;
        $('mult').textContent = mult.toFixed(2) + 'x';

        // Check Auto Cashouts
        [1, 2].forEach(p => {
          let target = parseFloat($(`b${p}Auto`).value);
          if (bets[p].active && !bets[p].cashed && target && mult >= target) {
            handleBetAction(p);
          }
        });

        updateSimulatedPlayers();
        let progressPct = Math.min(1, elapsed / 10);
        drawGameScene(progressPct, false);
      } else {
        // Crashed State
        if (inRound) {
          inRound = false;
          playSound('crash');
          $('mult').textContent = crashPoint.toFixed(2) + 'x';
          $('mult').classList.add('crashed');
          $('stateBadge').textContent = 'CRASHED';

          // Process un-cashed bets
          [1, 2].forEach(p => {
            if (bets[p].active && !bets[p].cashed) {
              $(`p${p}Status`).textContent = 'Crashed';
              $(`p${p}Status`).style.color = '#ff3d71';
              addHistory(p, bets[p].amount, 'Crash', 0);
            }
            bets[p].active = false;
          });

          // Add Pill
          let pill = document.createElement('span');
          pill.className = 'pill ' + (crashPoint >= 5 ? 'hot' : '');
          pill.textContent = crashPoint.toFixed(2) + 'x';
          $('rounds').prepend(pill);

          renderUI();
        }
        drawGameScene(1, true);
      }
    } catch (e) {
      console.error("Sync error:", e);
    }
  }

  // M-Pesa STK Push Payment Request Function
  async function sendPaymentRequest() {
    const phone = document.getElementById('stkPhone').value;
    const amount = document.getElementById('stkAmount').value;

    try {
      const response = await fetch('/api/v1/mpesa/stkpush', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, amount: amount })
      });

      const data = await response.json();
      if (response.ok) {
        alert("Check your phone! A PIN prompt has been sent.");
        closeModal('depositModal');
      } else {
        alert("Error: " + (data.error || "Failed to trigger STK"));
      }
    } catch (err) {
      alert("Could not connect to backend server.");
    }
  }

  // Initialization
  window.onload = () => {
    resizeCanvas();
    if (localStorage.skyrush_user) {
      currentUser = JSON.parse(localStorage.skyrush_user);
      updateUserUI();
    }
    renderUI();
    // Poll server state every 50ms for 60fps movement
    setInterval(syncGameWithServer, 50);
  };
</script>
